<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just The Tip</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#c0c0c0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Just The Tip">
    <link rel="icon" href="app-icons/app-icon-192.png">
</head>
<body>
<div class="window">

    <header class="titlebar">
        <span>
            Just The Tip
        </span>
    </header>

    <main>
        <label for="billAmount">
            Bill Amount
        </label>
        <div class="moneyInput">
            <span>
                $
            </span>
            <input
                id="billAmount"
                type="text"
                enterkeyhint="done"
                inputmode="decimal"
                placeholder="0.00"
                autocomplete="off">
        </div>

        <div class="wheelSection">
            <label>
                Tip
            </label>

            <!-- Current selected tip amount -->
            <div class="tipWindow">
                <div id="tipAmount">
                    $0.00
                </div>
                <div id="tipPercent">
                    0%
                </div>
            </div>

            <!-- Scrolling wheel -->
            <div id="tipStrip" class="tipStrip">
                <div id="stripContent" class="stripContent">
                    <!-- Generated by JavaScript -->
                </div>
            </div>
        </div>

        <div class="results">
            <div class="resultRow">
                <span>
                    Tip
                </span>
                <span id="tipValue">
                    $0.00
                </span>
            </div>

            <div class="resultRow total">
                <span>
                    Total
                </span>
                <span id="totalValue">
                    $0.00
                </span>
            </div>
        </div>
    </main>
</div>

<script src="script.js"></script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}

</script>
</body>
</html>
